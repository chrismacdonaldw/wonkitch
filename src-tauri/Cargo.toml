[package]
name = "wonkitch"
version = "0.1.19"
description = "A desktop Twitch stream and chat viewer"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wonkitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
axum = "0.8.9"
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
